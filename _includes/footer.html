{% include base_path %}

<div class="page__footer-follow">
  <ul class="social-icons">
    {% if site.author.email %}
      <li><a href="mailto:{{ site.author.email }}"><i class="fas fa-envelope" aria-hidden="true"></i> {{ site.author.email }}</a></li>
    {% endif %}
    {% if site.author.github %}
      <li><a href="{% if site.author.github contains 'http' %}{{ site.author.github }}{% else %}https://github.com/{{ site.author.github }}{% endif %}"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a></li>
    {% endif %}
    {% if site.author.xiaohongshu %}
      <li><a href="{{ site.author.xiaohongshu }}" target="_blank" rel="noopener">🍠 小红书</a></li>
    {% endif %}
  </ul>
</div>

<div class="page__footer-copyright">
  &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}
</div>
