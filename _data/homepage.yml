publications:
  - title: "STAMPsy: Towards SpatioTemporal-Aware Mixed-Type Dialogues for Psychological Counseling"
    year: 2025
    venue: "AAAI 2025, Oral Presentation"
    category: conferences
    featured: true
    excerpt: "Modeled evolving patient states across multi-session psychological counseling using event causality, non-verbal cues, and dynamic personas; built a dataset whose policies adapt counseling strategies to session-level feedback."
