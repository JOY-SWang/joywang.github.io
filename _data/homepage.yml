    demo: "https://sirrychen.github.io/share/2025-09-22-SpeechMedAssist.html"
    code: "https://anonymous.4open.science/r/SpeechMedAssist-Anonymous/"
    authors: "Chen S., Wang J., ... & Wei Z."

